name: Update timetable

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may start it late)
  workflow_dispatch:
  push:
    branches: [main, master, "claude/**"]
    paths: ["scraper/**", "site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch and parse the published sheet
        run: python3 scraper/timetable.py fetch || echo "::warning::fetch failed, publishing last good data"

      - name: Commit new or changed weeks
        run: |
          git config user.name "timetable-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weeks
          if ! git diff --cached --quiet; then
            git commit -m "Update timetable data"
            git push
          fi

      - name: Build site and feeds
        run: python3 scraper/timetable.py build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site


  # Separate job: deploy-pages lists the run's artifacts, and an artifact
  # uploaded in the same job may not be listed yet (race seen in practice).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
